name: Deploy lên GitHub Pages

# Mỗi lần push lên nhánh main là tự build và cập nhật trang.
# Muốn bấm chạy tay thì vào tab Actions → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nếu đang deploy dở mà push tiếp thì để lần deploy mới chạy nốt, không huỷ giữa chừng.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chạy test trước khi deploy: nội dung sai thì không đẩy lên
      - name: Kiểm tra kiểu dữ liệu và chạy test
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Build
        # GitHub Pages phục vụ ở /<tên-repo>/ nên phải đặt base cho đúng
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
